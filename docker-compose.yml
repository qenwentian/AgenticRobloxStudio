services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: studiosync
      POSTGRES_USER: studiosync
      POSTGRES_PASSWORD: ${STUDIOSYNC_POSTGRES_PASSWORD:?Set a PostgreSQL password in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studiosync -d studiosync"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build: .
    environment:
      STUDIOSYNC_DATABASE_URL: postgresql+psycopg://studiosync:${STUDIOSYNC_POSTGRES_PASSWORD}@postgres:5432/studiosync
      STUDIOSYNC_BOOTSTRAP_KEY: ${STUDIOSYNC_BOOTSTRAP_KEY:?Set an administrator bootstrap key in .env}
      STUDIOSYNC_EVENT_RETENTION_DAYS: 90
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
